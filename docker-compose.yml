# Entorno local completo: docker compose up --build
# Requiere un .env en la raíz (ver .env.example).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tcshop
      POSTGRES_PASSWORD: tcshop
      POSTGRES_DB: tcshop
    ports:
      - '5432:5432'
    volumes:
      - datos-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tcshop']
      interval: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://tcshop:tcshop@db:5432/tcshop?schema=public
      DIRECT_URL: postgresql://tcshop:tcshop@db:5432/tcshop?schema=public
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: http://localhost:3000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-}
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:3001
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  datos-db:
